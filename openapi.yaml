openapi: 3.0.0
info:
  title: "Jua Kali API \u2014 Organ Donation App Consumer Contract"
  version: 1.0.0
  description: "Scoped specifically to the interconnect relationship with the organ donation app (per\
    \ API_NEEDS.md / ENDPOINT_LIST.md). This is NOT a full document of Jua Kali's entire API surface \u2014\
    \ internal-only endpoints (auth, user management, reviews, the general booking list/create used by\
    \ Jua Kali's own frontend) are intentionally out of scope, since this consumer never calls them. All\
    \ paths below are implemented in server/routes/artisans.js and server/routes/bookings.js."
servers:
- url: http://localhost:3000
security:
- sessionAuth: []
paths:
  /api/artisans:
    get:
      summary: Return verified artisans and their services
      description: "Implemented in server/routes/artisans.js. Satisfies: \"The organ donation app needs\
        \ to read verified artisans and their services in order to identify workers who can provide services\
        \ when the hospital needs them.\" Also satisfies the pricing need (rate is included per artisan)\
        \ without a separate /services endpoint \u2014 see ENDPOINT_LIST.md's note on why a standalone\
        \ services catalog would misrepresent pricing.\n"
      security: []
      parameters:
      - name: skill
        in: query
        required: false
        schema:
          type: string
        example: Plumbing
      - name: verified
        in: query
        required: false
        schema:
          type: boolean
        example: true
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: object
                required:
                - ok
                - artisans
                properties:
                  ok:
                    type: boolean
                  artisans:
                    type: array
                    items:
                      $ref: '#/components/schemas/ArtisanPublic'
  /api/artisans/{id}:
    get:
      summary: Return details of a specific artisan
      description: Implemented in server/routes/artisans.js. Same need as GET /api/artisans, scoped to
        one artisan.
      security: []
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
        example: u-artisan
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: object
                required:
                - ok
                - artisan
                properties:
                  ok:
                    type: boolean
                  artisan:
                    $ref: '#/components/schemas/ArtisanPublic'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/bookings/{id}:
    get:
      summary: Return the full record for one booking
      description: "Implemented in server/routes/bookings.js. Added per ENDPOINT_LIST.md as a general-read\
        \ capability, not tied to one specific need statement \u2014 mirrors the /api/artisans + /api/artisans/{id}\
        \ collection/item pattern. Public by design; see the note in bookings.js about the customerName\
        \ privacy question this raises.\n"
      security: []
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
        example: b1
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: object
                required:
                - ok
                - booking
                properties:
                  ok:
                    type: boolean
                  booking:
                    $ref: '#/components/schemas/Booking'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/bookings/{id}/status:
    get:
      summary: Return only a booking's status
      description: 'Implemented in server/routes/bookings.js. Kept as its own nested sub-resource (the
        state genuinely belongs to one specific booking, same reasoning as /users/{id}/tasks from the
        lecture), rather than requiring the organ donation app to fetch the whole booking record just
        to check accept/decline status. Satisfies: "The organ donation app needs to read actions taken
        by the artisan (accepted or declined) in order to identify workers who have agreed to perform
        a particular service."

        '
      security: []
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
        example: b1
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: object
                required:
                - ok
                - status
                properties:
                  ok:
                    type: boolean
                  status:
                    type: string
                    enum:
                    - pending
                    - upcoming
                    - declined
                    - completed
              example:
                ok: true
                status: upcoming
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      summary: Update only a booking's status
      description: "Implemented in server/routes/bookings.js. Requires artisan auth \u2014 this is the\
        \ artisan's own accept/decline/complete action, not something the external consumer performs.\
        \ This is now the one real way to change a booking's status; the old general PATCH /api/bookings/{id}\
        \ was removed to avoid two routes doing the same job.\n"
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
        example: b1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateBookingStatus'
      responses:
        '200':
          description: Booking status updated
          content:
            application/json:
              schema:
                type: object
                required:
                - ok
                - booking
                properties:
                  ok:
                    type: boolean
                  booking:
                    $ref: '#/components/schemas/Booking'
        '400':
          description: Invalid status value
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
components:
  securitySchemes:
    sessionAuth:
      type: apiKey
      in: cookie
      name: connect.sid
      description: "express-session cookie, set automatically on successful login or registration. Swagger\
        \ UI will send it automatically once you've logged in through the browser the \"Try it out\" requests\
        \ share cookies with \u2014 a separate REST client (Postman etc.) needs \"withCredentials\"/cookie\
        \ handling turned on explicitly.\n"
  schemas:
    ArtisanPublic:
      type: object
      description: "Deliberately narrower than the full User schema \u2014 this is what an external consumer\
        \ (the organ donation app) sees, not what an admin sees. Excludes email and account status, which\
        \ are internal / customer-facing concerns, not relevant to \"find a worker for a job.\" This is\
        \ a judgment call, not something ENDPOINT_LIST.md specified field-by-field \u2014 worth the team\
        \ confirming before this gets built.\n"
      required:
      - id
      - fullname
      - skill
      - verified
      properties:
        id:
          type: string
          example: u-artisan
        fullname:
          type: string
          example: Faith Wanjiru
        phone:
          type: string
          nullable: true
          example: +254 700 000 003
        skill:
          type: string
          nullable: true
          example: Hair Styling
        verified:
          type: boolean
          example: true
        bio:
          type: string
          nullable: true
          example: Braids, perms, treatments and cuts.
        rate:
          type: string
          nullable: true
          example: From KES 500/style
    Booking:
      type: object
      required:
      - id
      - customerId
      - customerName
      - service
      - artisanId
      - artisanName
      - date
      - status
      properties:
        id:
          type: string
          example: b1
        customerId:
          type: string
          example: u-customer
        customerName:
          type: string
          example: Brian Otieno
        service:
          type: string
          example: Hair Styling
        artisanId:
          type: string
          example: u-artisan
        artisanName:
          type: string
          example: Faith Wanjiru
        date:
          type: string
          format: date
          example: '2026-07-14'
        status:
          type: string
          enum:
          - pending
          - upcoming
          - declined
          - completed
          example: upcoming
        price:
          type: string
          nullable: true
          example: KES 500
    UpdateBookingStatus:
      type: object
      required:
      - status
      properties:
        status:
          type: string
          enum:
          - upcoming
          - declined
          - completed
          example: completed
    Error:
      type: object
      description: "The real error shape used across every route in this codebase. Note the field is \"\
        error\", not \"message\" \u2014 the Week 4 contract had this wrong.\n"
      required:
      - ok
      - error
      properties:
        ok:
          type: boolean
          example: false
        error:
          type: string
          example: Not authorized.
  responses:
    Unauthorized:
      description: Not signed in, or signed in with the wrong role for this action
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            ok: false
            error: Not authorized.
    NotFound:
      description: The requested resource does not exist
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
